<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Timbre">
  <title>Timbre</title>
  <desc>Logo de Timbre: tres ondas sonoras en tonos azules</desc>

  <!-- Ondas centradas verticalmente en y=100, expandiéndose horizontalmente hacia la derecha -->

  <!-- Onda 1 (más interna, más sutil) — M18.5 74 a 126 (shift -10 desde el original) -->
  <path d="M 18.5 74 C 52.5 87, 52.5 113, 18.5 126"
        stroke="#60A5FA"
        stroke-opacity="0.34"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Onda 2 (media) — M63.5 59 a 141 -->
  <path d="M 63.5 59 C 115.5 79, 115.5 121, 63.5 141"
        stroke="#3B82F6"
        stroke-opacity="0.72"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Onda 3 (externa, más vibrante) — M124.5 42 a 158 -->
  <path d="M 124.5 42 C 196.5 70, 196.5 130, 124.5 158"
        stroke="#2563EB"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>
</svg>